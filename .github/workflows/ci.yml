name: CI

on:
  push:
    branches:
      - 'epic-*'
  pull_request:

jobs:
  unit-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: npm test
