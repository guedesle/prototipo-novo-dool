name: CI

on:
  push:
    branches:
      - 'epic-*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/audit-manifest.mjs .output/chrome-mv3/manifest.json
      - run: node scripts/audit-adapter-boundary.mjs
